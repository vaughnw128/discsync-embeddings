[project]
name = "discsync-embeddings"
version = "1.2.7"
description = "Vectorize your favorite chats."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "python-dotenv>=1.0.1",
    "SQLAlchemy>=2.0.35",
    "asyncpg>=0.30.0",
    "sqlmodel>=0.0.16",
    "qdrant-client>=1.9.2",
    "emoji>=2.15.0",
    "langchain-openai>=1.0.2",
    "langchain-qdrant>=1.1.0",
    "protobuf>=7.34.1,<8",
    "grpcio>=1.60.0",
    "googleapis-common-protos>=1.63.0",
]

[dependency-groups]
test = [
    "pytest",
]
dev = [
    "ruff",
    "hatchling",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning"
]
testpaths = [
    "tests"
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 120

[tool.ruff.lint]
fixable = ["ALL"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["discsync_embeddings"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]
